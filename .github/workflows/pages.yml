name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install browser dependencies
        run: |
          npm ci --prefix pdf-tools/pdf-tools/merge-pdf-tool
          npm ci --prefix pdf-tools/pdf-tools/rotate-pdf-page-tool
          npm ci --prefix pdf-tools/pdf-tools/compress-pdf-tool
          npm ci --prefix pdf-tools/pdf-tools/two-pages-one-pdf-tool
          mkdir -p node_modules
          cp -R pdf-tools/pdf-tools/compress-pdf-tool/node_modules/pdf-lib node_modules/
          cp -R pdf-tools/pdf-tools/compress-pdf-tool/node_modules/pdfjs-dist node_modules/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
